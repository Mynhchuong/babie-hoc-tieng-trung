:root{
  --ink:#5a1340; --muted:#b24c86; --line:#ffb3d6;
  --pink:#ff4fa3; --hot:#e0218a; --deep:#b3166b; --soft:#ffe6f2;
  --gold:#f6c94c; --gold2:#c9861e; --brown:#9a5512;
  --green:#3cc23a; --red:#e4323f;
  --red-soft:#ffe0ef; --green-soft:#e2f9da; --blue:#e0218a; --blue-soft:#ffe6f2; --pink2:#ff8cc6;
  --hz:"Microsoft JhengHei","微軟正黑體","PingFang TC","Noto Sans TC",sans-serif;
  --ui:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  --fun:"Baloo 2","Segoe UI",system-ui,sans-serif;
  --script:"Pacifico","Segoe Script",cursive;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;color:var(--ink);font-family:var(--ui);font-size:16px}
body{background:
  radial-gradient(circle at 8% 12%,rgba(255,255,255,.55) 0 40px,transparent 42px),
  radial-gradient(circle at 92% 20%,rgba(255,255,255,.35) 0 70px,transparent 72px),
  radial-gradient(circle at 85% 85%,rgba(255,255,255,.4) 0 55px,transparent 57px),
  radial-gradient(circle at 15% 78%,rgba(255,255,255,.3) 0 90px,transparent 92px),
  radial-gradient(circle at 50% 50%,rgba(255,255,255,.18) 0 160px,transparent 162px),
  radial-gradient(#fff 1px,transparent 1.6px) 0 0/34px 34px,
  linear-gradient(160deg,#ff8cc6 0%,#ffb7da 38%,#ffd8ea 70%,#ffc0df 100%);
  background-attachment:fixed}
button{font-family:inherit;font-size:inherit;cursor:pointer}
.wrap{max-width:1040px;margin:0 auto;padding:18px 16px 70px}
.spacer{flex:1}
.muted{color:var(--muted)} .small{font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.hint{font-size:12px;color:var(--deep);margin-top:10px;text-align:center}
kbd{font-family:var(--fun);font-size:11px;border:1.5px solid var(--line);border-bottom-width:3px;border-radius:6px;padding:0 5px;background:#fff;color:var(--hot)}

/* ---------- top bar ---------- */
header.top,.studyhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#fff;border-radius:26px;padding:10px 14px 10px 22px;
  box-shadow:0 5px 0 #f48cbf,0 14px 30px rgba(200,40,120,.18);margin-bottom:18px;border:3px solid #ffd1e6}
.brand{font-family:var(--script);font-size:30px;color:var(--hot);line-height:1.2;text-shadow:0 2px 0 #ffd1e6;white-space:nowrap}
.brand small{font-family:var(--fun);font-size:13px;color:var(--muted);margin-left:8px;font-weight:600}
.studyhead h2{margin:0;font-size:19px;font-family:var(--fun);font-weight:800;color:var(--hot)}
.studyhead h2 .hzt{font-family:var(--hz)}

/* ---------- jelly buttons ---------- */
.btn{position:relative;border:0;border-radius:999px;padding:9px 20px 8px;font-family:var(--fun);font-weight:800;font-size:15px;letter-spacing:.02em;
  color:var(--hot);background:linear-gradient(180deg,#ffffff 0%,#ffeaf4 60%,#ffd6ea 100%);
  box-shadow:inset 0 -3px 0 rgba(224,33,138,.12),0 4px 0 #f5a3cb,0 7px 14px rgba(200,40,120,.18);transition:transform .08s,box-shadow .08s,filter .15s}
.btn::before{content:"";position:absolute;left:14px;right:14px;top:3px;height:38%;border-radius:999px;background:linear-gradient(rgba(255,255,255,.9),rgba(255,255,255,0));pointer-events:none}
.btn:hover{filter:brightness(1.04) saturate(1.1)}
.btn:active{transform:translateY(3px);box-shadow:inset 0 -2px 0 rgba(0,0,0,.08),0 1px 0 #f5a3cb}
.btn.primary{color:#fff;text-shadow:0 1px 0 rgba(150,0,70,.45);background:linear-gradient(180deg,#ff9fd0 0%,#ff5aa9 45%,#e0218a 100%);
  box-shadow:inset 0 -3px 0 rgba(140,0,70,.25),0 4px 0 var(--deep),0 8px 16px rgba(200,20,110,.35)}
.btn.primary:active{box-shadow:0 1px 0 var(--deep)}
.btn.yes{color:#fff;text-shadow:0 1px 0 rgba(0,90,0,.4);background:linear-gradient(180deg,#a8f78e 0%,#5fd84a 50%,#2fb12b 100%);box-shadow:inset 0 -3px 0 rgba(0,80,0,.2),0 4px 0 #1e8a1c,0 8px 16px rgba(30,140,30,.3)}
.btn.no{color:#fff;text-shadow:0 1px 0 rgba(120,0,0,.4);background:linear-gradient(180deg,#ff9a9a 0%,#f24b55 50%,#d1222e 100%);box-shadow:inset 0 -3px 0 rgba(120,0,0,.2),0 4px 0 #9c111b,0 8px 16px rgba(200,30,40,.3)}
.btn.ghost{background:transparent;box-shadow:none;color:var(--deep)} .btn.ghost::before{display:none}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.btn.round{width:44px;height:44px;padding:0;display:inline-grid;place-items:center;font-size:19px}

/* tabs = pill game buttons */
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{position:relative;border:0;border-radius:999px;padding:8px 18px 7px;font-family:var(--fun);font-weight:800;font-size:15px;color:var(--hot);
  background:linear-gradient(180deg,#fff,#ffe3f0);box-shadow:0 4px 0 #f5a3cb,0 6px 12px rgba(200,40,120,.15)}
.tab.on{color:#fff;text-shadow:0 1px 0 rgba(150,0,70,.45);background:linear-gradient(180deg,#ff9fd0 0%,#ff5aa9 45%,#e0218a 100%);box-shadow:inset 0 -3px 0 rgba(140,0,70,.25),0 4px 0 var(--deep)}
.tab::before{content:"";position:absolute;left:12px;right:12px;top:3px;height:38%;border-radius:999px;background:linear-gradient(rgba(255,255,255,.85),rgba(255,255,255,0))}

/* ---------- cards ---------- */
.card{background:#fff;border:3px solid #ffc4df;border-radius:26px;box-shadow:0 6px 0 #f48cbf,0 16px 30px rgba(200,40,120,.18)}
.card.gold{color:#fff;border:5px solid var(--gold);
  background:
    linear-gradient(118deg,transparent 0 22%,rgba(255,255,255,.28) 22% 33%,transparent 33% 37%,rgba(255,255,255,.2) 37% 40%,transparent 40%),
    linear-gradient(180deg,#ff9fcc 0%,#f77fb8 100%);
  box-shadow:0 0 0 3px #e3a73a,0 7px 0 3px var(--brown),0 18px 34px rgba(150,40,90,.3),inset 0 0 0 3px rgba(255,255,255,.45)}
.gold .muted,.gold .small{color:#fff;font-weight:600;font-size:14px;text-shadow:0 1px 0 rgba(180,20,100,.4)}
.gold .py{color:#fff;text-shadow:0 2px 0 rgba(180,20,100,.5)}

/* ---------- home dashboard ---------- */
.dash{display:grid;grid-template-columns:1.15fr 1fr;gap:18px;margin-bottom:22px}
.today{padding:20px 22px;display:flex;gap:20px;align-items:center}
.today h3{margin:0 0 2px;font-family:var(--fun);font-weight:800;font-size:24px;color:#fff;text-shadow:0 2px 0 rgba(180,20,100,.5)}
.today p{margin:0 0 12px;font-size:14px;color:#fff;font-weight:600}
.ring{--p:0;width:128px;height:128px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:conic-gradient(#fff calc(var(--p)*1%),rgba(255,255,255,.3) 0);box-shadow:0 0 0 4px var(--gold),0 5px 0 4px var(--brown)}
.ring>div{width:96px;height:96px;border-radius:50%;background:linear-gradient(180deg,#ff6fb5,#e0218a);display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:inset 0 4px 0 rgba(255,255,255,.35)}
.ring b{font-family:var(--fun);font-size:36px;color:#fff;line-height:1}
.ring span{font-size:11px;color:#ffe3f1;font-weight:600}
.stats{display:grid;grid-template-columns:repeat(4,auto);gap:4px 16px;font-size:12px;color:#fff;justify-content:start;font-weight:600}
.stats b{display:block;font-family:var(--fun);font-weight:800;font-size:24px;color:#fff;line-height:1.1;text-shadow:0 2px 0 rgba(180,20,100,.5)}
.cal{padding:14px 18px}
.cal .hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal .hd b{font-family:var(--fun);font-weight:800;font-size:18px;color:var(--hot)}
.cal .hd button{position:relative;border:0;width:34px;height:34px;border-radius:50%;color:#fff;font-weight:800;font-size:18px;line-height:1;
  background:linear-gradient(180deg,#ff9fd0,#e0218a);box-shadow:0 3px 0 var(--deep)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}
.days .w{font-family:var(--fun);font-weight:800;font-size:12px;color:var(--muted)}
.days .d{height:34px;border-radius:12px;display:grid;place-items:center;font-size:13px;font-family:var(--fun);font-weight:600;color:#d78db3;background:#fff4f9}
.days .d.l1{background:#ffd1e7;color:var(--ink)}
.days .d.l2{background:linear-gradient(180deg,#ffa6d3,#ff6fb5);color:#fff}
.days .d.l3{background:linear-gradient(180deg,#ff6fb5,#e0218a);color:#fff;box-shadow:0 3px 0 var(--deep)}
.days .d.l3::after{content:"♥";position:absolute;font-size:9px;transform:translate(11px,-11px)}
.days .d{position:relative}
.days .d.td{box-shadow:0 0 0 3px var(--gold)}
.legend{display:flex;gap:6px;align-items:center;font-size:11px;color:var(--muted);margin-top:8px;justify-content:flex-end}
.legend i{width:12px;height:12px;border-radius:4px;display:inline-block}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;margin-top:14px}
.lesson{padding:14px 16px 16px;position:relative;cursor:pointer;transition:transform .15s}
.lesson:hover{transform:translateY(-4px) rotate(-.4deg)}
.lesson .num{display:inline-block;font-family:var(--fun);font-weight:800;font-size:13px;color:#fff;padding:2px 12px 1px;border-radius:999px;
  background:linear-gradient(180deg,#ff9fd0,#e0218a);box-shadow:0 3px 0 var(--deep)}
.lesson .tt{font-family:var(--hz);font-size:21px;margin:10px 0 2px;color:var(--ink);font-weight:700}
.lesson .tv{font-size:13px;color:var(--muted);min-height:18px}
.lesson .meta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:10px;font-family:var(--fun);font-weight:600}
.lesson.sel{border-color:var(--gold);box-shadow:0 0 0 3px #e3a73a,0 6px 0 3px var(--brown)}
.chk{position:absolute;top:12px;right:12px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;
  background:linear-gradient(180deg,#fff,#ffe3f0);box-shadow:inset 0 0 0 2px #ffb3d6,0 3px 0 #f5a3cb}
.lesson.sel .chk{background:linear-gradient(180deg,#ff9fd0,#e0218a);box-shadow:0 3px 0 var(--deep)}
.bar{height:16px;border-radius:999px;background:linear-gradient(180deg,#f06aa8,#ff8cc6);padding:3px;box-shadow:inset 0 2px 3px rgba(150,0,70,.35),0 0 0 2px #e2559a;margin-top:8px}
.bar>i{display:block;height:100%;min-width:0;border-radius:999px;background:linear-gradient(180deg,#c9ff9e 0%,#6fdc4b 45%,#34b42c 100%);box-shadow:inset 0 2px 0 rgba(255,255,255,.6);position:relative}
.selbar{position:sticky;bottom:12px;margin-top:18px;padding:12px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sec-title{font-family:var(--fun);font-weight:800;color:#fff;font-size:22px;text-shadow:0 2px 0 rgba(180,20,100,.45);margin:0}
.lead{color:var(--deep);font-size:13px;margin:8px 0 0;font-weight:600}

/* ---------- study ---------- */
.opts{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:14px;color:var(--deep);margin:12px 0 0;background:#fff;border-radius:18px;padding:10px 16px;border:2px dashed #ffb3d6;font-weight:600}
.opts label{display:flex;gap:6px;align-items:center;cursor:pointer}
.opts input{accent-color:var(--hot);width:17px;height:17px}
.seg{display:inline-flex;border-radius:999px;overflow:hidden;box-shadow:0 0 0 2px #ffb3d6}
.seg button{border:0;background:#fff;padding:5px 12px;color:var(--hot);font-family:var(--fun);font-weight:800}
.seg button.on{background:linear-gradient(180deg,#ff9fd0,#e0218a);color:#fff}
#stage{margin-top:18px}
.progress{display:flex;align-items:center;gap:12px;font-size:14px;color:var(--deep);margin-bottom:14px;font-family:var(--fun);font-weight:800}
.progress .bar{flex:1;margin:0}
.timer{font-family:var(--fun);font-weight:800;font-size:14px;color:var(--deep);margin-left:auto;background:#fff0f7;border-radius:999px;padding:5px 12px}
.flash{perspective:1400px;height:350px;cursor:pointer;user-select:none}
.flash .in{position:relative;width:100%;height:100%;transition:transform .5s cubic-bezier(.3,1.4,.5,1);transform-style:preserve-3d}
.flash.flip .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
.face.back{transform:rotateY(180deg)}
.big-hz{font-family:var(--hz);font-weight:700;font-size:clamp(56px,12vw,110px);line-height:1.15;word-break:break-all;color:#fff;
  text-shadow:0 4px 0 #d0287f,0 8px 18px rgba(150,0,70,.35)}
.py{font-family:var(--fun);font-weight:800;font-size:26px;color:var(--hot);margin-top:8px}
.vi{font-family:var(--fun);font-weight:800;font-size:clamp(24px,4.6vw,34px);line-height:1.3;color:#fff;text-shadow:0 2px 0 rgba(180,20,100,.5)}
.face .corner{position:absolute;top:12px;left:18px;font-family:var(--fun);font-weight:800;font-size:13px;color:#fff;letter-spacing:.08em;text-transform:uppercase;
  background:rgba(224,33,138,.55);padding:2px 12px;border-radius:999px}
.spk{position:absolute;top:12px;right:14px;width:46px;height:46px;border-radius:50%;border:0;font-size:20px;display:grid;place-items:center;
  background:linear-gradient(180deg,#ff9fd0,#e0218a);box-shadow:inset 0 4px 0 rgba(255,255,255,.45),0 4px 0 var(--deep),0 0 0 3px var(--gold)}
.spk:active{transform:translateY(3px);box-shadow:0 1px 0 var(--deep),0 0 0 3px var(--gold)}
.actions{display:flex;gap:12px;justify-content:center;margin-top:20px;flex-wrap:wrap}
.q{padding:34px 20px 26px;text-align:center;position:relative}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}
.choice{position:relative;text-align:left;padding:14px 16px;border-radius:16px;min-height:62px;display:flex;gap:12px;align-items:center;
  font-family:var(--fun);font-weight:800;font-size:17px;color:#b0135f;border:3px solid var(--gold);
  background:linear-gradient(118deg,transparent 0 30%,rgba(255,255,255,.45) 30% 38%,transparent 38%),linear-gradient(180deg,#ffe0ef,#ffb6d8);
  box-shadow:0 4px 0 var(--gold2),0 8px 14px rgba(200,40,120,.2);transition:transform .08s}
.choice:hover{filter:brightness(1.04)}
.choice:active{transform:translateY(3px);box-shadow:0 1px 0 var(--gold2)}
.choice .k{flex:none;width:28px;height:28px;border-radius:50%;color:#fff;display:grid;place-items:center;font-size:13px;background:linear-gradient(180deg,#ff9fd0,#e0218a);box-shadow:0 2px 0 var(--deep)}
.choice.hzc{font-family:var(--hz);font-size:26px}
.choice.ok{color:#fff;background:linear-gradient(180deg,#a8f78e,#2fb12b);box-shadow:0 4px 0 #1e8a1c}
.choice.bad{color:#fff;background:linear-gradient(180deg,#ff9a9a,#d1222e);box-shadow:0 4px 0 #9c111b}
.write input{width:100%;font-size:24px;padding:13px 20px;border-radius:999px;border:3px solid var(--gold);background:linear-gradient(180deg,#c8105d,#e0216f);color:#fff;
  font-family:var(--fun);font-weight:800;outline:none;box-shadow:inset 0 4px 6px rgba(80,0,30,.4),0 4px 0 var(--gold2);margin-top:6px;text-align:center}
.write input::placeholder{color:#ffb7d5;font-weight:600}
.feedback{margin-top:14px;padding:12px 16px;border-radius:18px;font-size:16px;font-weight:700;color:#fff}
.feedback.ok{background:linear-gradient(180deg,#8be66f,#2fb12b);box-shadow:0 4px 0 #1e8a1c}
.feedback.bad{background:linear-gradient(180deg,#ff8a8a,#d1222e);box-shadow:0 4px 0 #9c111b}
.done{padding:40px 20px;text-align:center}
.done p{font-family:var(--fun);font-weight:800;font-size:18px}
.done .score{font-family:var(--fun);font-weight:800;font-size:72px;line-height:1;color:#fff;text-shadow:0 5px 0 #d0287f}
.star{border:0;background:transparent;font-size:22px;color:#ffd6e8;text-shadow:0 2px 0 #f5a3cb}
.star.on{color:#ffd21f;text-shadow:0 2px 0 #d69a00}
.btn.star{color:#ffc1dc} .btn.star.on{color:#ffcc12;text-shadow:0 2px 0 #c98a00}

/* ---------- list ---------- */
.search{flex:1;min-width:200px;padding:10px 18px;border-radius:999px;border:3px solid #ffc4df;background:#fff;font-size:15px;outline:none;font-weight:600;color:var(--ink)}
.search:focus{border-color:var(--hot)}
table.list{width:100%;border-collapse:collapse}
table.list td,table.list th{padding:9px 8px;border-bottom:2px dashed #ffd6ea;text-align:left;vertical-align:middle}
table.list th{font-family:var(--fun);font-weight:800;font-size:14px;color:var(--hot)}
table.list .hz{font-family:var(--hz);font-size:23px;white-space:nowrap;font-weight:700}
table.list .py{font-size:16px;margin:0;color:var(--hot)}
.vi-ed{width:100%;min-width:150px;border:2px solid transparent;background:transparent;border-radius:12px;padding:6px 10px;font:inherit;color:var(--ink)}
.vi-ed:hover{border-color:#ffc4df;background:#fff}
.vi-ed:focus{outline:none;border-color:var(--hot);background:#fff}
.vi-ed.edited{background:#fff3f9;border-color:#ffa6d1}
.pill{display:inline-block;font-size:11px;padding:2px 10px;border-radius:99px;font-family:var(--fun);font-weight:800;color:#fff;background:linear-gradient(180deg,#8be66f,#2fb12b)}
.pill.r{background:linear-gradient(180deg,#ff8a8a,#d1222e)}


/* ---------- icon trang trí ---------- */
.ic{width:1em;height:1em;flex:none;overflow:visible}
.brand-ic{width:52px;height:52px;margin:-6px -4px -6px -8px;transform:rotate(-12deg)}
.corner-ic{position:absolute;transform:rotate(var(--r,0deg));pointer-events:none;z-index:2}
.today,.cal{position:relative}
.cal{padding-top:22px}
.lesson-ic{position:absolute;right:12px;top:46px;width:52px;height:52px;transform:rotate(8deg);opacity:.95;transition:transform .2s}
.lesson:hover .lesson-ic{transform:rotate(-6deg) scale(1.15)}
.lesson .tt,.lesson .tv{padding-right:44px}
.top-ic{position:absolute;top:-34px;left:50%;width:62px;height:62px;margin-left:-31px;z-index:3;pointer-events:none}
.q{margin-top:26px}
.flash{margin-top:26px}
.face{overflow:visible}
.deco{position:fixed;inset:0;pointer-events:none;z-index:0}
.deco .fl{position:absolute;height:auto;aspect-ratio:1;animation:floaty 6s ease-in-out infinite;transform:rotate(var(--r))}
.deco .tw{position:absolute;height:auto;aspect-ratio:1;animation:tw 3s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(var(--r))}50%{transform:translateY(-14px) rotate(calc(var(--r)*-1))}}
@keyframes tw{0%,100%{opacity:.3;transform:scale(.7)}50%{opacity:1;transform:scale(1.1)}}
@media (max-width:1260px){.deco .fl{opacity:.45;width:48px!important}}
@media (max-width:760px){.deco .fl{display:none}.brand-ic{width:40px;height:40px}}
/* ---------- modal / misc ---------- */
.timer:empty{display:none}
.banner{padding:10px 12px 10px 20px;margin:-4px 0 18px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px;border-radius:999px}
.modal{position:fixed;inset:0;background:rgba(120,20,70,.35);backdrop-filter:blur(3px);display:grid;place-items:center;padding:16px;z-index:8}
.modal .card{width:min(580px,100%);max-height:86vh;overflow:auto;padding:22px 24px;color:var(--ink);background:#fff;border:5px solid var(--gold);box-shadow:0 0 0 3px #e3a73a,0 7px 0 3px var(--brown),0 20px 40px rgba(120,20,70,.35)}
.modal h3{margin:6px 0 10px;font-family:var(--fun);font-weight:800;font-size:22px;color:var(--hot)}
.logrow{display:flex;justify-content:space-between;gap:10px;padding:9px 4px;border-bottom:2px dashed #ffd6ea;font-size:14px}
.logrow b{color:var(--hot);font-family:var(--fun);font-weight:800}
.field{display:flex;align-items:center;gap:10px;margin:10px 0;flex-wrap:wrap;font-weight:600}
.field input[type=number]{width:84px;padding:7px 12px;border-radius:999px;border:3px solid #ffc4df;font-size:16px;font-family:var(--fun);font-weight:800;color:var(--hot);text-align:center}
.note{background:#fff3f9;border:2px dashed #ff9fcd;border-radius:18px;padding:12px 16px;font-size:14px;line-height:1.6}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(10px);color:#fff;padding:10px 20px;border-radius:999px;font-family:var(--fun);font-weight:800;
  background:linear-gradient(180deg,#ff9fd0,#e0218a);box-shadow:0 4px 0 var(--deep),0 0 0 3px var(--gold);opacity:0;transition:.25s;pointer-events:none;z-index:9}
.toast.show{opacity:1;transform:translateX(-50%)}
.sparkle{position:fixed;pointer-events:none;color:#fff;opacity:.85;font-size:22px;text-shadow:0 0 8px #fff;animation:tw 3s ease-in-out infinite;z-index:0}
@keyframes tw{0%,100%{opacity:.2;transform:scale(.7)}50%{opacity:.95;transform:scale(1.1)}}
.wrap{position:relative;z-index:1}

@media (max-width:760px){
  .dash{grid-template-columns:1fr}
  .today{flex-direction:column;text-align:center}
  .stats{grid-template-columns:repeat(2,auto);justify-content:center}
  .brand{font-size:20px;white-space:normal}
}
@media (max-width:640px){
  .choices{grid-template-columns:1fr}
  .flash{height:290px}
  .timer{order:5;margin-left:0}
}

<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>
<script>
const DATA = /*__DATA__*/null;

/* ---------- storage (an toàn khi mở file trực tiếp) ---------- */
const KEY='onTiengTrung_v1';
let store={};
try{store=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){store={}}
function save(){store.updated=Date.now();try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){}fileSaveSoon()}

/* ---------- TỰ LƯU RA FILE tien_do_hoc.json (Chrome / Edge) ---------- */
const FS_OK='showSaveFilePicker' in window&&'indexedDB' in window;
let fh=null,fileState='none',fileTimer=null,lastFileSave=0;   // none | need | on
function idb(){return new Promise((ok,no)=>{const r=indexedDB.open('onTiengTrung',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
async function kvGet(k){const db=await idb();return new Promise(ok=>{const q=db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>ok(q.result);q.onerror=()=>ok(null)})}
async function kvSet(k,v){const db=await idb();return new Promise(ok=>{const t=db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=ok;t.onerror=ok})}
function fileSaveSoon(){if(fileState!=='on')return;clearTimeout(fileTimer);fileTimer=setTimeout(writeFile,Date.now()-lastFileSave>15000?800:8000)}
async function writeFile(){
  if(!fh||fileState!=='on')return;
  try{const w=await fh.createWritable();await w.write(JSON.stringify(store));await w.close();lastFileSave=Date.now();showFileStatus()}
  catch(e){fileState='need';showFileStatus()}
}
async function readFileStore(){const f=await fh.getFile();const t=await f.text();if(!t.trim())return null;const o=JSON.parse(t);return o&&o.p&&o.s?o:null}
// dùng dữ liệu mới hơn giữa trình duyệt và file
async function syncFromFile(){
  let o=null;try{o=await readFileStore()}catch(e){}
  if(o&&(o.updated||0)>(store.updated||0)){
    try{localStorage.setItem(KEY,JSON.stringify(o))}catch(e){}
    location.reload();return true;
  }
  fileState='on';await writeFile();return false;
}
async function initFile(){
  if(!FS_OK)return;
  try{fh=await kvGet('fh')}catch(e){fh=null}
  if(!fh){showFileStatus();return}
  let p='prompt';try{p=await fh.queryPermission({mode:'readwrite'})}catch(e){}
  if(p==='granted'){await syncFromFile()}else{fileState='need'}
  showFileStatus();
}
async function resumeFile(){
  try{const p=await fh.requestPermission({mode:'readwrite'});if(p!=='granted'){toast('Chưa được cho phép lưu file');return}
    if(!await syncFromFile()){toast('Đã bật tự lưu tiến độ ♥')}}catch(e){toast('Không mở được file, chọn lại nha');fh=null;fileState='none'}
  showFileStatus();
}
async function pickNewFile(){
  try{fh=await showSaveFilePicker({suggestedName:'tien_do_hoc.json',startIn:'documents',types:[{description:'Tiến độ học',accept:{'application/json':['.json']}}]});
    await kvSet('fh',fh);
    let o=null;try{o=await readFileStore()}catch(e){}
    if(o&&(o.updated||0)>(store.updated||0)&&confirm('File này đã có tiến độ cũ (mới hơn trên trình duyệt). Dùng tiến độ trong file?')){localStorage.setItem(KEY,JSON.stringify(o));location.reload();return}
    fileState='on';await writeFile();toast('Đã bật tự lưu vào '+fh.name+' ♥');
  }catch(e){if(e&&e.name!=='AbortError')toast('Không tạo được file')}
  showFileStatus();
}
async function pickOldFile(){
  try{const [h]=await showOpenFilePicker({types:[{description:'Tiến độ học',accept:{'application/json':['.json']}}]});
    fh=h;const p=await fh.requestPermission({mode:'readwrite'});if(p!=='granted')return;
    const o=await readFileStore();if(!o){toast('File không đúng định dạng');return}
    await kvSet('fh',fh);localStorage.setItem(KEY,JSON.stringify(o));toast('Đã mở tiến độ, đang tải lại…');setTimeout(()=>location.reload(),700);
  }catch(e){if(e&&e.name!=='AbortError')toast('Không mở được file')}
}
function fileBanner(){
  if(!FS_OK)return '';
  if(fileState==='need')return `<div class="banner card" id="fbn">💾 <b>Bấm để tiếp tục tự lưu tiến độ</b> vào file <i>${esc(fh.name)}</i><div class="spacer"></div><button class="btn primary" id="fRes">Cho phép lưu</button></div>`;
  if(fileState==='none'&&!S.hideFileTip)return `<div class="banner card" id="fbn">💾 <span><b>Bật tự lưu tiến độ</b> (làm 1 lần): bấm nút hồng → cửa sổ hiện ra thì bấm <b>Save / Lưu</b> là xong.</span><div class="spacer"></div><button class="btn ghost" id="fHide">Để sau</button><button class="btn primary" id="fNew">Bật tự lưu</button></div>`;
  return '';
}
function showFileStatus(){
  const el=$('#fstat');if(el)el.innerHTML=fileState==='on'?`💾 Tự lưu: ${lastFileSave?new Date(lastFileSave).toTimeString().slice(0,5):'bật'}`:'';
  const b=$('#fbn');if(view==='home'&&(b||fileState!=='on')&&!$('.modal')){const html=fileBanner();if(b){if(html)b.outerHTML=html;else b.remove()}else if(html){const h=$('header.top');if(h)h.insertAdjacentHTML('afterend',html)}bindBanner()}
}
function bindBanner(){
  const r=$('#fRes');if(r)r.onclick=resumeFile;
  const n=$('#fNew');if(n)n.onclick=pickNewFile;
  const h=$('#fHide');if(h)h.onclick=()=>{S.hideFileTip=1;save();$('#fbn').remove()};
}
window.addEventListener('pagehide',()=>{if(fileState==='on')writeFile()});

/* ---------- BÁO CÁO CHO HALKEN (Google Apps Script) ---------- */
const REPORT_URL=/*__REPORT__*/'';
let lastSig='',lastSent=0;
function reportPayload(){
  const days={};const d0=new Date();
  for(let i=0;i<14;i++){const x=new Date(d0);x.setDate(d0.getDate()-i);const k=dkey(x);const v=LOG[k];
    if(v&&v.s>0)days[k]={s:v.s,a:v.a,f:v.f||'',t:v.t||'',l:(v.l||[]).join(' | ')}}
  return {v:1,sent:new Date().toISOString(),today:today(),goal:S.goal,streak:streak(),
    studied:studied().length,known:ALL.filter(w=>(store.p[w.id]||{}).k).length,total:ALL.length,
    totalMin:Math.round(Object.values(LOG).reduce((x,d)=>x+d.s,0)/60),days};
}
function sendReport(force){
  if(!REPORT_URL||!navigator.onLine)return;
  const p=reportPayload();const sig=JSON.stringify(p.days)+p.known;
  if(!force&&sig===lastSig)return;
  if(!force&&Date.now()-lastSent<60000)return;
  lastSig=sig;lastSent=Date.now();
  try{fetch(REPORT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(p),keepalive:true}).catch(()=>{lastSig=''})}catch(e){lastSig=''}
}
document.addEventListener('visibilitychange',()=>{if(document.hidden)sendReport(true)});
setInterval(()=>{if(view==='study')sendReport(false)},5*60000);
store.p=store.p||{}; store.s=store.s||{};
const S=store.s; // settings
if(S.front===undefined)S.front='hz'; if(!S.py2){S.showPy=false;S.py2=1}
store.e=store.e||{};const EDIT=store.e;
if(S.auto===undefined)S.auto=false; if(S.shuffle===undefined)S.shuffle=true;
if(S.book===undefined)S.book=0;

/* ---------- flatten words ---------- */
const ALL=[];
DATA.books.forEach((b,bi)=>b.lessons.forEach(l=>l.words.forEach((w,i)=>{
  const id=`${b.id}-${l.n}-${i}`;const o={id,hz:w[0],py:w[1],vi:EDIT[id]||w[2],orig:w[2],book:bi,lesson:l.n};
  ALL.push(o);(l._w=l._w||[]).push(o);
})));
const P=id=>store.p[id]||(store.p[id]={k:0,w:0,st:0});

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const ic=(n,c='',st='')=>`<svg class="ic ${c}" style="${st}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const LESSON_IC=['crown','heel','butterfly','dress','mirror','balloon','gift','bow','lipstick','tiara','flower','glasses','perfume','wand','carriage'];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1800)}
function normPy(s){return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/ü|u:/g,'v').replace(/[^a-z]/g,'')}
function normVi(s){return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/gi,'d').toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim()}

/* ---------- đọc to (giọng Đài Loan nếu máy có) ---------- */
let voice=null;
function pickVoice(){
  if(!('speechSynthesis' in window))return;
  const vs=speechSynthesis.getVoices();
  voice=vs.find(v=>/zh[-_]TW/i.test(v.lang))||vs.find(v=>/zh[-_]HK/i.test(v.lang))||vs.find(v=>/^zh/i.test(v.lang))||null;
}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function speak(t){
  if(!('speechSynthesis' in window)){toast('Trình duyệt không hỗ trợ đọc');return}
  speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);
  u.lang=voice?voice.lang:'zh-TW';if(voice)u.voice=voice;u.rate=.85;speechSynthesis.speak(u);
}

/* ---------- state ---------- */
let gen=0;
let view='home', sel=new Set(), deck=[], deckName='', mode='flash', search='';

/* ================= NHẬT KÝ HỌC ================= */
store.log=store.log||{};const LOG=store.log;
if(!S.goal)S.goal=15;
const pad=n=>String(n).padStart(2,'0');
const dkey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>dkey(new Date());
const day=k=>LOG[k]||(LOG[k]={s:0,a:0,f:null,t:null});
let lastAct=Date.now(),tick=0;
['mousedown','keydown','touchstart','wheel'].forEach(ev=>document.addEventListener(ev,()=>lastAct=Date.now(),{passive:true}));
setInterval(()=>{
  if(view!=='study'||document.hidden||Date.now()-lastAct>90000)return;
  const d=day(today()),now=new Date(),hm=`${pad(now.getHours())}:${pad(now.getMinutes())}`;
  d.s++;if(!d.f)d.f=hm;d.t=hm;
  if(++tick%10===0)save();
  const t=$('#tmr');if(t)t.textContent='⏱ Hôm nay: '+fmt(d.s);
},1000);
window.addEventListener('beforeunload',save);
document.addEventListener('visibilitychange',save);
function logAns(){day(today()).a++}
function fmt(sec){const m=Math.floor(sec/60);if(m<1)return sec+' giây';const h=Math.floor(m/60);return h?`${h} giờ ${m%60} phút`:`${m} phút`}
function streak(){
  let n=0;const d=new Date();
  if(!(LOG[dkey(d)]&&LOG[dkey(d)].s>=60))d.setDate(d.getDate()-1);
  while(LOG[dkey(d)]&&LOG[dkey(d)].s>=60){n++;d.setDate(d.getDate()-1)}
  return n;
}
const studied=()=>Object.keys(LOG).filter(k=>LOG[k].s>=60);
let calM=null;
function calendar(){
  const now=new Date();if(!calM)calM=new Date(now.getFullYear(),now.getMonth(),1);
  const y=calM.getFullYear(),m=calM.getMonth(),first=(new Date(y,m,1).getDay()+6)%7,n=new Date(y,m+1,0).getDate();
  let h='';['T2','T3','T4','T5','T6','T7','CN'].forEach(w=>h+=`<div class="w">${w}</div>`);
  for(let i=0;i<first;i++)h+='<div></div>';
  for(let d=1;d<=n;d++){
    const k=`${y}-${pad(m+1)}-${pad(d)}`,s=(LOG[k]||{}).s||0,g=S.goal*60;
    const lv=s<60?'':s<g/2?'l1':s<g?'l2':'l3';
    h+=`<div class="d ${lv} ${k==today()?'td':''}" title="${s?fmt(s):''}">${d}</div>`;
  }
  return `<div class="card cal">${ic('bow','corner-ic',"top:-24px;left:50%;margin-left:-28px;width:56px;height:56px")}<div class="hd"><button id="cP">‹</button><b>Tháng ${m+1} / ${y}</b><button id="cN">›</button></div>
    <div class="days">${h}</div>
    <div class="legend">ít <i style="background:#ffd6ea"></i><i style="background:#ff9fcd"></i><i style="background:#e0218a"></i> đủ mục tiêu</div></div>`;
}

/* ================= HOME ================= */
function home(){
  if(view==='study')setTimeout(()=>sendReport(true),300);
  view='home';gen++;save();
  const b=DATA.books[S.book];
  const stars=ALL.filter(w=>P(w.id).st).length, hard=ALL.filter(w=>P(w.id).w>0&&!P(w.id).k).length;
  const td=LOG[today()]||{s:0,a:0},pct=Math.min(100,Math.round(td.s*100/(S.goal*60)));
  const st=streak(),days=studied(),total=Object.values(LOG).reduce((x,d)=>x+d.s,0),known=ALL.filter(w=>P(w.id).k).length;
  const hr=new Date().getHours(),hi=hr<11?'Chào buổi sáng':hr<14?'Chào buổi trưa':hr<18?'Chào buổi chiều':'Chào buổi tối';
  const msg=td.s<60?'Hôm nay mình chưa học nè, học một chút nha ♡':pct<100?`Còn ${Math.max(1,Math.ceil((S.goal*60-td.s)/60))} phút nữa là đủ mục tiêu rồi!`:'Hôm nay giỏi quá, đủ mục tiêu rồi 🎀';
  $('#app').innerHTML=`
  <header class="top">
    ${ic('crown','brand-ic')}<div class="brand">Halken nhắc Babie học tiếng Trung ${ic('heart','',"width:.8em;height:.8em;vertical-align:-.05em")}</div>
    <div class="spacer"></div>
    <span class="timer" id="fstat"></span>${REPORT_URL?`<span class="timer" title="Tiến độ học được gửi cho Halken mỗi ngày">📤 Báo cáo cho Halken</span>`:""}
    <button class="btn primary" id="bLog">📒 Nhật ký</button>
    <button class="btn round" id="bSet" title="Cài đặt">⚙️</button>
  </header>
  ${fileBanner()}
  <div class="dash">
    <div class="card gold today">${ic('wand','corner-ic',"top:-26px;right:18px;width:64px;height:64px;--r:14deg")}${ic('butterfly','corner-ic',"bottom:-18px;right:-14px;width:54px;height:54px;--r:-10deg")}
      <div class="ring" style="--p:${pct}"><div><b>${Math.floor(td.s/60)}</b><span>/ ${S.goal} phút</span></div></div>
      <div style="flex:1">
        <h3>${hi} ♡</h3><p>${msg}</p>
        <div class="stats">
          <div><b>🔥 ${st}</b>ngày liên tiếp</div>
          <div><b>${days.length}</b>ngày đã học</div>
          <div><b>${known}</b>từ đã thuộc</div>
          <div><b>${Math.round(total/60)}</b>phút tổng</div>
        </div>
        ${S.last?`<button class="btn primary" id="bCont" style="margin-top:14px">Học tiếp ${esc(S.last.name)} →</button>`:''}
      </div>
    </div>
    ${calendar()}
  </div>
  <div class="row">
    <div class="tabs">${DATA.books.map((x,i)=>`<button class="tab ${i==S.book?'on':''}" data-b="${i}">${esc(x.name)}</button>`).join('')}</div>
    <div class="spacer"></div>
    ${stars?`<button class="btn" id="bStar">★ Đánh dấu (${stars})</button>`:''}
    ${hard?`<button class="btn" id="bHard">💔 Hay sai (${hard})</button>`:''}
  </div>
  <p class="lead">Bấm vào bài để học · bấm nút tròn góc phải để chọn nhiều bài ôn chung</p>
  <div class="grid">${b.lessons.map(l=>{
    const ws=l._w||[],k=ws.filter(w=>P(w.id).k).length,p=ws.length?Math.round(k*100/ws.length):0,key=S.book+':'+l.n;
    return `<div class="card lesson ${sel.has(key)?'sel':''}" data-l="${l.n}">${ic(LESSON_IC[(l.n-1)%LESSON_IC.length],'lesson-ic')}
      <div class="chk" data-c="${key}">${sel.has(key)?'✓':''}</div>
      <div class="num">Bài ${l.n}${p==100?' 🎀':''}</div>
      <div class="tt">${esc(l.title||'')}</div>
      <div class="tv">${esc(l.titleVi||'')}</div>
      <div class="meta"><span>${ws.length} từ</span><span>thuộc ${p}%</span></div>
      <div class="bar"><i style="width:${p}%"></i></div></div>`}).join('')}</div>
  ${sel.size?`<div class="card selbar">${ic('heart','',"width:30px;height:30px")}<b>Đã chọn ${sel.size} bài</b><span class="muted small">(${selWords().length} từ)</span><div class="spacer"></div>
    <button class="btn ghost" id="bClr">Bỏ chọn</button><button class="btn primary" id="bGo">Ôn các bài đã chọn →</button></div>`:''}
  `;
  document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{S.book=+t.dataset.b;save();home()});
  document.querySelectorAll('.lesson').forEach(el=>el.onclick=e=>{
    const c=e.target.closest('.chk');
    if(c){const k=c.dataset.c;sel.has(k)?sel.delete(k):sel.add(k);home();return}
    const l=b.lessons.find(x=>x.n==el.dataset.l);
    S.last={b:S.book,n:l.n,name:`Bài ${l.n}`};save();
    openDeck(l._w,`${b.short||b.name} · Bài ${l.n} ${l.title||''}`);
  });
  const cont=$('#bCont');if(cont)cont.onclick=()=>{const bb=DATA.books[S.last.b];const l=bb&&bb.lessons.find(x=>x.n==S.last.n);if(l)openDeck(l._w,`${bb.short||bb.name} · Bài ${l.n} ${l.title||''}`)};
  const g=$('#bGo');if(g)g.onclick=()=>openDeck(selWords(),`Ôn ${sel.size} bài`);
  const c=$('#bClr');if(c)c.onclick=()=>{sel.clear();home()};
  const bs=$('#bStar');if(bs)bs.onclick=()=>openDeck(ALL.filter(w=>P(w.id).st),'★ Từ đánh dấu');
  const bh=$('#bHard');if(bh)bh.onclick=()=>openDeck(ALL.filter(w=>P(w.id).w>0&&!P(w.id).k),'💔 Từ hay sai');
  $('#cP').onclick=()=>{calM.setMonth(calM.getMonth()-1);home()};
  $('#cN').onclick=()=>{calM.setMonth(calM.getMonth()+1);home()};
  $('#bLog').onclick=showLog;$('#bSet').onclick=showSettings;bindBanner();showFileStatus();
}
function modal(html){
  const m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="card">${html}<div class="actions"><button class="btn primary" data-x>Đóng</button></div></div>`;
  m.onclick=e=>{if(e.target===m||e.target.closest('[data-x]')){m.remove();home()}};
  document.body.appendChild(m);return m;
}
function showLog(){
  const ks=Object.keys(LOG).filter(k=>LOG[k].s>0).sort().reverse();

function openDeck(words,name){deck=words.slice();deckName=name;{const d=day(today());d.l=d.l||[];if(!d.l.includes(name))d.l.push(name);}mode='flash';search='';study()}
function study(){
  view='study';gen++;
  const modes=[['flash','🃏 Thẻ ghi nhớ'],['quiz','✅ Trắc nghiệm'],['write','✏️ Viết pinyin'],['list','📋 Danh sách']];
  if(!modes.some(m=>m[0]==mode))mode='flash';
  $('#app').innerHTML=`
  <div class="studyhead">
    <button class="btn" id="bBack">← Trang chủ</button>
    ${ic('tiara','',"width:42px;height:42px")}<h2>${esc(deckName)}</h2><span class="muted small" style="font-weight:600">${deck.length} từ</span>
    <span class="timer" id="tmr">⏱ Hôm nay: ${fmt((LOG[today()]||{s:0}).s)}</span>
    <button class="btn round" id="bOpt" title="Tùy chọn">⚙️</button>
  </div>

    <span class="seg"><button data-f="hz" class="${S.front=='hz'?'on':''}">Chữ Hán</button><button data-f="vi" class="${S.front=='vi'?'on':''}">Tiếng Việt</button></span>
    <label><input type="checkbox" id="oPy" ${S.showPy?'checked':''}> Hiện pinyin</label>
    <label><input type="checkbox" id="oSh" ${S.shuffle?'checked':''}> Trộn thứ tự</label>
    <label><input type="checkbox" id="oAu" ${S.auto?'checked':''}> Tự đọc to</label>

  $('#bOpt').onclick=()=>{S.optOpen=!S.optOpen;save();$('#opts').style.display=S.optOpen?'flex':'none'};
  document.querySelectorAll('[data-m]').forEach(t=>t.onclick=()=>{mode=t.dataset.m;study()});
  document.querySelectorAll('[data-f]').forEach(t=>t.onclick=()=>{S.front=t.dataset.f;save();study()});

const order=()=>S.shuffle?shuffle(deck):deck.slice();
const pyHtml=w=>S.showPy?`<div class="py">${esc(w.py)}</div>`:'';

/* ---- Thẻ ghi nhớ ---- */
function flash(q){
  let cards=q||order(),i=0,flipped=false,unknown=[];
  const draw=()=>{
    if(i>=cards.length){
      $('#stage').innerHTML=`<div class="card gold done">${ic('crown','',"width:110px;height:110px;margin-top:-80px;display:block;margin-left:auto;margin-right:auto")}<div class="score">${cards.length-unknown.length}/${cards.length}</div>
      <p>từ đã thuộc trong lượt này</p><div class="actions">
      ${unknown.length?`<button class="btn primary" id="again">Ôn lại ${unknown.length} từ chưa thuộc</button>`:''}
      <button class="btn" id="restart">Học lại từ đầu</button></div></div>`;
      const a=$('#again');if(a)a.onclick=()=>flash(shuffle(unknown));$('#restart').onclick=()=>flash();return}
    const w=cards[i];flipped=false;
    const hzSide=`<div class="big-hz">${esc(w.hz)}</div>${pyHtml(w)}`;
    const viSide=`<div class="vi">${esc(w.vi)}</div>`;
    const full=`<div class="big-hz" style="font-size:56px">${esc(w.hz)}</div><div class="py">${esc(w.py)}</div><div class="vi" style="margin-top:10px">${esc(w.vi)}</div>`;
    $('#stage').innerHTML=`
    <div class="progress"><span>${i+1} / ${cards.length}</span><div class="bar"><i style="width:${i*100/cards.length}%"></i></div>
      ${P(w.id).k?'<span class="pill">đã thuộc</span>':''}</div>
    <div class="flash" id="fc"><div class="in">
      <div class="card gold face front">${ic('bow','top-ic')}<span class="corner">${S.front=='hz'?'Chữ Hán':'Tiếng Việt'}</span>${S.front=='hz'?hzSide:viSide}<div class="small muted" style="position:absolute;bottom:14px">bấm để lật thẻ</div></div>
      <div class="card gold face back">${ic('crown','top-ic')}<span class="corner">Đáp án</span><button class="spk" data-s>🔊</button>${full}</div>
    </div></div>
    <div class="actions">
      <button class="btn" id="prev" ${i?'':'disabled'}>←</button>
      <button class="btn no" id="no">✗ Chưa thuộc</button>
      <button class="btn yes" id="yes">✓ Đã thuộc</button>
      <button class="btn star ${P(w.id).st?'on':''}" id="st" title="Đánh dấu">★</button>
    </div>
    <div class="hint"><kbd>Space</kbd> lật thẻ · <kbd>1</kbd> chưa thuộc · <kbd>2</kbd> đã thuộc · <kbd>←</kbd> quay lại · lật thẻ là tự đọc 🔊</div>`;
    const fc=$('#fc');
    fc.onclick=e=>{if(e.target.closest('[data-s]')){speak(w.hz);return}flipped=!flipped;fc.classList.toggle('flip',flipped);
      if(flipped)setTimeout(()=>speak(w.hz),250);else speechSynthesis&&speechSynthesis.cancel()};
    $('#prev').onclick=()=>{i--;draw()};
    $('#no').onclick=()=>mark(0);$('#yes').onclick=()=>mark(1);
    $('#st').onclick=e=>{P(w.id).st^=1;save();e.target.classList.toggle('on')};
    if('speechSynthesis' in window)speechSynthesis.cancel();
  };
  const mark=k=>{const w=cards[i],p=P(w.id);p.k=k;logAns();if(!k){p.w++;unknown.push(w)}save();i++;draw()};
  keyHandler=e=>{
    if(e.code=='Space'){e.preventDefault();$('#fc')&&$('#fc').click()}
    else if(e.key=='1')$('#no')&&mark(0);else if(e.key=='2')$('#yes')&&mark(1);
    else if(e.key=='ArrowLeft'&&i>0){i--;draw()}else if(e.key=='ArrowRight'&&$('#yes')){i++;draw()}
    else if(e.key.toLowerCase()=='s'&&cards[i]&&$('#fc.flip'))speak(cards[i].hz);
  };
  draw();
}

/* ---- Trắc nghiệm ---- */
function quiz(){
  const my=gen;let qs=order(),i=0,right=0,wrongs=[],locked=false;
  const pool=deck.length>=4?deck:ALL;
  const draw=()=>{
    if(i>=qs.length){
      $('#stage').innerHTML=`<div class="card gold done">${ic('crown','',"width:110px;height:110px;margin-top:-80px;display:block;margin-left:auto;margin-right:auto")}<div class="score">${right}/${qs.length}</div><p>câu đúng</p>
      <div class="actions">${wrongs.length?`<button class="btn primary" id="again">Làm lại ${wrongs.length} câu sai</button>`:''}<button class="btn" id="restart">Làm lại tất cả</button></div></div>`;
      const a=$('#again');if(a)a.onclick=()=>{qs=shuffle(wrongs);wrongs=[];i=0;right=0;draw()};
      $('#restart').onclick=()=>quiz();return}
    locked=false;const w=qs[i];
    const others=shuffle(pool.filter(x=>x.id!==w.id&&x.vi!==w.vi&&x.hz!==w.hz)).slice(0,3);
    const opts=shuffle([w,...others]);const askHz=S.front=='hz';
    $('#stage').innerHTML=`
    <div class="progress"><span>Câu ${i+1} / ${qs.length}</span><div class="bar"><i style="width:${i*100/qs.length}%"></i></div><span>Đúng ${right}</span></div>
    <div class="card gold q">${ic('tiara','top-ic')}<button class="spk" data-s>🔊</button>
      ${askHz?`<div class="big-hz" style="font-size:64px">${esc(w.hz)}</div>${pyHtml(w)}`:`<div class="vi">${esc(w.vi)}</div>`}
    </div>
    <div class="choices">${opts.map((o,k)=>`<button class="choice ${askHz?'':'hzc'}" data-k="${k}"><span class="k">${k+1}</span><span>${esc(askHz?o.vi:o.hz)}${!askHz&&S.showPy?`<div class="small muted" style="font-family:var(--ui)">${esc(o.py)}</div>`:''}</span></button>`).join('')}</div>
    <div id="fb"></div>`;
    $('[data-s]').onclick=()=>speak(w.hz);
    if(S.auto&&askHz)speak(w.hz);
    const pick=k=>{
      if(locked){next();return}locked=true;
      const ok=opts[k].id===w.id;const btns=document.querySelectorAll('.choice');
      btns.forEach((b,j)=>{if(opts[j].id===w.id)b.classList.add('ok')});
      const p=P(w.id);
      logAns();if(ok){right++;p.k=1}else{btns[k].classList.add('bad');p.w++;p.k=0;wrongs.push(w)}
      save();
      $('#fb').innerHTML=`<div class="feedback ${ok?'ok':'bad'}">${ok?'Chính xác!':'Sai rồi.'} <b style="font-family:var(--hz)">${esc(w.hz)}</b> ${esc(w.py)} = ${esc(w.vi)} <span class="small">— bấm <kbd>Enter</kbd> để tiếp</span></div>`;
      if(!askHz)speak(w.hz);
      if(ok)setTimeout(()=>{if(gen===my&&locked&&qs[i]===w)next()},900);
    };
    const next=()=>{i++;draw()};
    document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>pick(+b.dataset.k));
    keyHandler=e=>{if(/^[1-4]$/.test(e.key)&&!locked)pick(+e.key-1);else if(e.key=='Enter'&&locked)next()};
  };
  draw();
}

/* ---- Viết ---- */
function pyVariants(py){
  const out=new Set();
  const expand=v=>{const m=v.match(/\(([^)]*)\)/);if(!m){out.add(normPy(v));return}
    expand(v.replace(m[0],m[1]));expand(v.replace(m[0],''));};
  py.split('/').forEach(expand);out.add(normPy(py));out.delete('');return out;
}
function write(){
  let qs=order(),i=0,right=0,wrongs=[],state=0;
  const draw=()=>{
    if(i>=qs.length){
      $('#stage').innerHTML=`<div class="card gold done">${ic('crown','',"width:110px;height:110px;margin-top:-80px;display:block;margin-left:auto;margin-right:auto")}<div class="score">${right}/${qs.length}</div><p>từ viết đúng pinyin</p>
      <div class="actions">${wrongs.length?`<button class="btn primary" id="again">Viết lại ${wrongs.length} từ sai</button>`:''}<button class="btn" id="restart">Làm lại tất cả</button></div></div>`;
      const a=$('#again');if(a)a.onclick=()=>{qs=shuffle(wrongs);wrongs=[];i=0;right=0;draw()};
      $('#restart').onclick=()=>write();return}
    state=0;const w=qs[i];
    $('#stage').innerHTML=`
    <div class="progress"><span>${i+1} / ${qs.length}</span><div class="bar"><i style="width:${i*100/qs.length}%"></i></div><span>Đúng ${right}</span></div>
    <div class="card gold q write">${ic('mirror','top-ic')}<button class="spk" data-s>🔊</button>
      <div class="big-hz" style="font-size:72px">${esc(w.hz)}</div>
      <p class="muted small">Gõ pinyin của chữ này — không cần dấu thanh, VD: <i>xuesheng</i> hoặc <i>xue2sheng1</i></p>
      <input id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Gõ pinyin rồi bấm Enter" style="font-family:var(--ui)">
      <div id="fb"></div>
      <div class="actions"><button class="btn" id="hint">💡 Gợi ý</button><button class="btn" id="skip">Không biết</button><button class="btn primary" id="chk">Kiểm tra</button></div>
    </div>`;
    const inp=$('#ans');inp.focus();
    $('[data-s]').onclick=()=>speak(w.hz);
    if(S.auto)speak(w.hz);
    $('#hint').onclick=()=>{$('#fb').innerHTML=`<div class="feedback" style="background:#fff;color:var(--hot)">Nghĩa: <b>${esc(w.vi)}</b></div>`;inp.focus()};
    const check=give=>{
      if(state){i++;draw();return}
      const v=normPy(inp.value);if(!give&&!v){inp.focus();return}
      state=1;
      const ok=!give&&pyVariants(w.py).has(v);const p=P(w.id);logAns();
      if(ok){right++;p.k=1}else{p.w++;p.k=0;wrongs.push(w)}save();
      $('#fb').innerHTML=`<div class="feedback ${ok?'ok':'bad'}">${ok?'Đúng rồi! 🎀':'Chưa đúng, đáp án:'}
        <div style="margin-top:6px"><b style="font-family:var(--hz);font-size:22px">${esc(w.hz)}</b> &nbsp;<b style="font-size:20px">${esc(w.py)}</b> — ${esc(w.vi)}</div></div>`;
      $('#chk').textContent='Tiếp →';$('#hint').style.display='none';$('#skip').style.display='none';speak(w.hz);
    };
    $('#chk').onclick=()=>check(false);$('#skip').onclick=()=>check(true);
    keyHandler=e=>{if(e.key=='Enter'){e.preventDefault();check(false)}};
  };
  draw();
}

/* ---- Danh sách ---- */
function list(){
  const q=normVi(search),qp=normPy(search);
  const rows=deck.filter(w=>!search||w.hz.includes(search.trim())||(qp&&normPy(w.py).includes(qp))||normVi(w.vi).includes(q));
  $('#stage').innerHTML=`
  <div class="row" style="margin-bottom:10px">
    <input class="search" id="q" placeholder="Tìm chữ Hán / pinyin / tiếng Việt" value="${esc(search)}">
    <button class="btn" id="cp">📋 Copy cho Quizlet</button>
    <button class="btn" id="dl">⬇ Tải file .txt</button>
  </div>
  <div class="card" style="padding:4px 12px;overflow-x:auto"><table class="list">
    <tr><th></th><th>Chữ Hán</th><th>Pinyin</th><th>Tiếng Việt</th><th></th><th></th></tr>
    ${rows.map(w=>`<tr><td><button class="star ${P(w.id).st?'on':''}" data-st="${w.id}">★</button></td>
      <td class="hz">${esc(w.hz)}</td><td class="py">${esc(w.py)}</td><td><input class="vi-ed ${w.vi!==w.orig?'edited':''}" data-ed="${w.id}" value="${esc(w.vi)}" title="Bấm để sửa nghĩa"></td>
      <td>${P(w.id).k?'<span class="pill">thuộc</span>':P(w.id).w?'<span class="pill r">sai '+P(w.id).w+'</span>':''}</td>
      <td><button class="star" style="color:var(--muted)" data-sp="${esc(w.hz)}">🔊</button></td></tr>`).join('')}
  </table></div>
  <p class="hint">✏️ Bấm vào ô nghĩa tiếng Việt để sửa, sửa xong bấm Enter hoặc bấm ra ngoài là tự lưu. Xóa trống rồi Enter để trả về nghĩa gốc.</p>
  <p class="hint">Quizlet: vào <b>Tạo học phần → Nhập</b>, dán nội dung. Giữa thuật ngữ và định nghĩa chọn <b>Tab</b>, giữa các thẻ chọn <b>Dòng mới</b>.</p>`;
  const qi=$('#q');qi.oninput=()=>{search=qi.value;const pos=qi.selectionStart;list();const n=$('#q');n.focus();n.setSelectionRange(pos,pos)};
  document.querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>{const p=P(b.dataset.st);p.st^=1;save();b.classList.toggle('on')});
  document.querySelectorAll('[data-sp]').forEach(b=>b.onclick=()=>speak(b.dataset.sp));
  document.querySelectorAll('[data-ed]').forEach(inp=>{
    const commit=()=>{const w=ALL.find(x=>x.id===inp.dataset.ed);let v=inp.value.trim();
      if(!v)v=w.orig;if(v===w.vi){inp.value=v;return}
      w.vi=v;inp.value=v;if(v===w.orig)delete EDIT[w.id];else EDIT[w.id]=v;save();
      inp.classList.toggle('edited',v!==w.orig);toast(v===w.orig?'Đã trả về nghĩa gốc':'Đã lưu nghĩa mới ♡')};
    inp.onchange=commit;inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();inp.blur()}};
  });
  const txt=()=>deck.map(w=>`${w.hz} (${w.py})\t${w.vi}`).join('\n');
  $('#cp').onclick=()=>{const t=txt();
    (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('Đã copy '+deck.length+' từ — dán vào Quizlet'))
    .catch(()=>{const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');toast('Đã copy')}catch(e){toast('Không copy được')}a.remove()})};
  $('#dl').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+txt()],{type:'text/plain'}));a.download=deckName.replace(/[\\/:*?"<>|·]/g,'').trim()+'.txt';a.click()};
  keyHandler=null;
}

let keyHandler=null;
document.addEventListener('keydown',e=>{if(view!=='study'||!keyHandler)return;if(e.target.tagName==='INPUT'&&(e.key!=='Enter'||e.target.dataset.ed!==undefined))return;keyHandler(e)});
home();
initFile();
setTimeout(()=>sendReport(true),3000);
</script>
</body>
</html>
